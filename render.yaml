services:
  - type: web
    name: wallet-ai
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WALLET_AI_SECRET
        generateValue: true

databases:
  - name: wallet-ai-db
    plan: free
    region: singapore
