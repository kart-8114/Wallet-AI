services:
  - type: web
    name: wallet-ai
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WALLET_AI_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
        placeholder: "Paste your Google Gemini API key here"
      - key: GA_MEASUREMENT_ID
        sync: false
        placeholder: "G-XXXXXXXXXX (Optional)"

databases:
  - name: wallet-ai-db
    plan: free
    region: singapore
