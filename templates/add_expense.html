{% extends "base.html" %}
{% block title %}Add transaction · Wallet AI{% endblock %}
{% block page_title %}Add transaction{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;">
  <form method="POST">
    <label for="type">Type</label>
    <select id="type" name="type">
      <option value="expense">Expense</option>
      <option value="income">Income</option>
    </select>

    <div class="field-row">
      <div>
        <label for="amount">Amount (₹)</label>
        <input type="number" step="0.01" min="0" id="amount" name="amount" placeholder="0.00" required>
      </div>
      <div>
        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{ today }}" required>
      </div>
    </div>

    <label for="category">Category</label>
    <select id="category" name="category">
      {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>

    <label for="merchant">Merchant (optional)</label>
    <input type="text" id="merchant" name="merchant" placeholder="e.g. Blue Bottle Coffee">

    <label for="note">Note (optional)</label>
    <textarea id="note" name="note" rows="2" placeholder="Add a note..."></textarea>

    <button type="submit" class="btn btn-primary btn-block">Save transaction</button>
  </form>
</div>
{% endblock %}
