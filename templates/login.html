{% extends "base.html" %}
{% block title %}Log in · Wallet AI{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">₹</span>
      <span class="brand-text" style="color:var(--ink);">Wallet <strong style="color:var(--emerald);">AI</strong></span>
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to see where your money went.</p>
    <form method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <div class="auth-foot">
      <a href="{{ url_for('mpin_login') }}">Use 4-digit MPIN instead</a>
    </div>
    <div class="auth-foot">
      New here? <a href="{{ url_for('register') }}">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
